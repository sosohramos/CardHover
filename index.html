<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Hover — HTML e CSS</title>


  <link rel="stylesheet" href="estilo.css">
</head>


<body>
  <h1><span>Meus</span> Aplicativos</h1>
  <p>Passe o mouse sobre os cartões ou use a tecla Tab.</p>


  <main class="container">


    <article class="card" tabindex="0"
      style="--cor: #c806f8;">
      <div class="frente">
        <span class="icone" aria-hidden="true">ig</span>
      </div>


      <div class="verso">
        <h2>Instagram</h2>
        <p>Aplicativo de compartilhamento de fotos e vídeos de curta e longa duração.</p>
      </div>
    </article>


    <article class="card" tabindex="0"
      style="--cor: #2f80c2;">
      <div class="frente">
        <span class="icone" aria-hidden="true">ttk</span>
      </div>


      <div class="verso">
        <h2>TikTok</h2>
        <p>Plataforma de vídeos curtos.</p>
      </div>
    </article>


    <article class="card" tabindex="0"
      style="--cor:#010907;">
      <div class="frente">
        <span class="icone" aria-hidden="true">S</span>
      </div>


      <div class="verso">
        <h2>Shein</h2>
        <p>Site de compras.</p>
      </div>
    </article>


  </main>
</body>
</html>
